ine x1="351" y1="573" x2="509" y2="573" stroke="#334155" stroke-width="1"/><text x="361" y="589" font-size="11" text-anchor="start" fill="#0f172a" font-weight="400" font-family="'JetBrains Mono', Consolas, monospace">+findPath(…)</text></g><g><rect x="519" y="545" width="158" height="76" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.2"/><path d="M525,545 h146 a6,6 0 0 1 6,6 v22 h-158 v-22 a6,6 0 0 1 6,-6 z" fill="url(#hg)"/><rect x="519" y="551" width="3" height="16" fill="#0891b2" rx="1.5"/><text x="598" y="564" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="600">AStar</text><line x1="519" y1="573" x2="677" y2="573" stroke="#334155" stroke-width="1"/><text x="529" y="589" font-size="11" text-anchor="start" fill="#475569" font-weight="400" font-family="'JetBrains Mono', Consolas, monospace">-h: Heuristic</text><line x1="519" y1="597" x2="677" y2="597" stroke="#cbd5e1" stroke-width="1"/><text x="529" y="613" font-size="11" text-anchor="start" fill="#0f172a" font-weight="400" font-family="'JetBrains Mono', Consolas, monospace">+findPath(…)</text></g><g><rect x="687" y="545" width="158" height="108" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.2"/><path d="M693,545 h146 a6,6 0 0 1 6,6 v22 h-158 v-22 a6,6 0 0 1 6,-6 z" fill="url(#hg)"/><rect x="687" y="551" width="3" height="16" fill="#0891b2" rx="1.5"/><text x="766" y="564" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="600">Adaptive</text><line x1="687" y1="573" x2="845" y2="573" stroke="#334155" stroke-width="1"/><text x="697" y="589" font-size="11" text-anchor="start" fill="#475569" font-weight="400" font-family="'JetBrains Mono', Consolas, monospace">-short, long</text><text x="697" y="605" font-size="11" text-anchor="start" fill="#475569" font-weight="400" font-family="'JetBrains Mono', Consolas, monospace">-threshold: int</text><line x1="687" y1="613" x2="845" y2="613" stroke="#cbd5e1" stroke-width="1"/><text x="697" y="629" font-size="11" text-anchor="start" fill="#0f172a" font-weight="400" font-family="'JetBrains Mono', Consolas, monospace">+choose(g, s, t)</text><text x="697" y="645" font-size="11" text-anchor="start" fill="#0f172a" font-weight="400" font-family="'JetBrains Mono', Consolas, monospace">+findPath(…)</text></g><g><rect x="519" y="685" width="158" height="108" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.2"/><path d="M525,685 h146 a6,6 0 0 1 6,6 v22 h-158 v-22 a6,6 0 0 1 6,-6 z" fill="url(#hg)"/><rect x="519" y="691" width="3" height="16" fill="#0891b2" rx="1.5"/><text x="598" y="704" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="600">ALT</text><line x1="519" y1="713" x2="677" y2="713" stroke="#334155" stroke-width="1"/><text x="529" y="729" font-size="11" text-anchor="start" fill="#475569" font-weight="400" font-family="'JetBrains Mono', Consolas, monospace">-k: int = 8</text><text x="529" y="745" font-size="11" text-anchor="start" fill="#475569" font-weight="400" font-family="'JetBrains Mono', Consolas, monospace">-dists: Float64[][]</text><line x1="519" y1="753" x2="677" y2="753" stroke="#cbd5e1" stroke-width="1"/><text x="529" y="769" font-size="11" text-anchor="start" fill="#0f172a" font-weight="400" font-family="'JetBrains Mono', Consolas, monospace">+prepare(g)</text><text x="529" y="785" font-size="11" text-anchor="start" fill="#0f172a" font-weight="400" font-family="'JetBrains Mono', Consolas, monospace">-h = max|dL(t)−dL(v)|</text></g><path d="M170,160 L170,120 L380,120 L380,84" fill="none" stroke="#334155" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#tri)"/><path d="M560,140 L560,120 L480,120 L480,84" fill="none" stroke="#334155" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#tri)"/><path d="M800,140 L800,54 L570,54" fill="none" stroke="#334155" stroke-width="1.3" marker-end="url(#open)"/><rect x="633.08" y="37.5" width="113.84" height="15.5" fill="#fff" opacity=".92" rx="3"/><text x="690" y="48" font-size="10.5" text-anchor="middle" fill="#475569" font-weight="400" font-family="'JetBrains Mono', Consolas, monospace">-router 1 «delega»</text><path d="M170,284 L170,335" fill="none" stroke="#334155" stroke-width="1.3" marker-end="url(#open)"/><rect x="176" y="307.5" width="72.68" height="15.5" fill="#fff" opacity=".92" rx="3"/><text x="180" y="318" font-size="10.5" text-anchor="start" fill="#475569" font-weight="400" font-family="'JetBrains Mono', Consolas, monospace">-strategy 1</text><path d="M470,385 L320,385" fill="none" stroke="#334155" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/><rect x="373.36" y="368.5" width="43.28" height="15.5" fill="#fff" opacity=".92" rx="3"/><text x="395" y="379" font-size="10.5" text-anchor="middle" fill="#475569" font-weight="400" font-family="'JetBrains Mono', Consolas, monospace">«crea»</text><path d="M94,545 L94,515 L766,515" fill="none" stroke="#334155" stroke-width="1.3"/><path d="M262,545 L262,515" fill="none" stroke="#334155" stroke-width="1.3"/><path d="M430,545 L430,515" fill="none" stroke="#334155" stroke-width="1.3"/><path d="M598,545 L598,515" fill="none" stroke="#334155" stroke-width="1.3"/><path d="M766,545 L766,515" fill="none" stroke="#334155" stroke-width="1.3"/><path d="M170,515 L170,423" fill="none" stroke="#334155" stroke-width="1.3" marker-end="url(#tri)"/><path d="M598,685 L598,621" fill="none" stroke="#334155" stroke-width="1.3" marker-end="url(#tri)"/><path d="M835,545 L835,492 L280,492 L280,423" fill="none" stroke="#334155" stroke-width="1.3" marker-end="url(#open)" marker-start="url(#dia)"/><rect x="514.84" y="485.5" width="90.32000000000001" height="15.5" fill="#fff" opacity=".92" rx="3"/><text x="560" y="496" font-size="10.5" text-anchor="middle" fill="#475569" font-weight="400" font-family="'JetBrains Mono', Consolas, monospace">short, long  2</text><path d="M15,690 h468 l12,12 v47 h-480 z" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1"/><path d="M483,690 v12 h12" fill="none" stroke="#a78bfa"/><text x="25" y="709" font-size="11" text-anchor="start" fill="#4c1d95" font-weight="400">Strategy: Router (contexto) delega en RoutingStrategy; las estrategias se</text><text x="25" y="724" font-size="11" text-anchor="start" fill="#4c1d95" font-weight="400">intercambian en ejecución sin tocar Router, caché ni UI (principio abierto/cerrado).</text><text x="25" y="739" font-size="11" text-anchor="start" fill="#4c1d95" font-weight="400">Todas usan MinHeap O(log n) salvo LegacyDijkstra (línea base AS-IS, O(V²)).</text><path d="M20,22 h243 l12,12 v47 h-255 z" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1"/><path d="M263,22 v12 h12" fill="none" stroke="#a78bfa"/><text x="30" y="41" font-size="11" text-anchor="start" fill="#4c1d95" font-weight="400">Proxy: CachedRouter tiene la misma</text><text x="30" y="56" font-size="11" text-anchor="start" fill="#4c1d95" font-weight="400">interfaz que Router; el cliente no</text><text x="30" y="71" font-size="11" text-anchor="start" fill="#4c1d95" font-weight="400">distingue un hit de un cálculo.</text>
